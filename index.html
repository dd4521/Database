<style>

.close-btn{

</style>

<body>

<div class="header-bar">
  <div class="title">Employee Dashboard</div>
  <div id="eventsBar"></div>
  <div id="gradeSummary" class="grade-summary"></div>
  <div id="employeeCount" class="employee-count"></div>
</div>

<div class="top">

  <input type="file" id="fileInput">

  <div class="search-box">
    <input type="text" id="search" placeholder="Search...">

    <!-- SORT BUTTON -->
    <button onclick="openSort()" class="icon-btn">
      ⇅
    </button>

    <!-- FILTER BUTTON -->
    <button onclick="toggleFilter()" class="icon-btn">
      ⚙
    </button>
  </div>

</div>

<div id="filterPanel" class="filter-modal">

  <div class="filter-header">
    <span>Filters</span>
    <span onclick="clearFilters()" class="clear-icon">✖</span>
  </div>

  <div class="filter-body">

  <!-- Grade -->
  <label>Grade</label>
  <select id="gradeFilter"></select>

  <!-- Department -->
  <label>Department</label>
  <select id="deptFilter"></select>

  <!-- Unit -->
  <label>Unit</label>
  <select id="unitFilter"></select>

  <!-- Blood Group -->
  <label>Blood Group</label>
  <select id="bloodFilter"></select>

  <!-- Experience -->
  <label>Experience</label>
  <select id="expFilter"></select>

  <!-- Promotion Status -->
  <label>Promotion Status</label>
  <select id="promotionFilter">
    <option value="">All</option>
    <option value="due">Due Soon</option>
    <option value="overdue">Overdue</option>
  </select>

  <!-- Eligibility -->
  <label>Eligibility</label>
  <select id="eligibilityFilter">
    <option value="">All</option>
    <option value="yes">Eligible</option>
    <option value="no">Not Eligible</option>
  </select>

  <!-- Dropped Years -->
  <label>Dropped Years</label>
  <select id="droppedFilter">
    <option value="">All</option>
    <option value="1">1</option>
    <option value="2">2</option>
    <option value="3">3</option>
    <option value="4">4</option>
    <option value="5">5</option>
    <option value="6">6</option>
    <option value="7">7</option>
    <option value="7+">7+</option>
  </select>

  <!-- ACTION BUTTONS -->
  <div class="filter-actions">
  <button class="apply-btn" onclick="applyFilters()">Apply</button>
  <button class="clear-btn" onclick="clearFilters()">Clear</button>
  </div>

</div>

</div>

<div id="list" class="container"></div>

<div id="sortModal" class="sort-modal">

  <div class="sort-header">
    <span>Sort</span>
    <span onclick="closeSort()">✕</span>
  </div>

  <div class="sort-options">
    <div onclick="applySort('name')">Names A to Z</div>
    <div onclick="applySort('seniority')">Seniority</div>
    <div onclick="applySort('age')">Age</div>
    <div onclick="applySort('exp')">Experience</div>
    <div onclick="applySort('grade')">Grades (E8 to E0)</div>
    <div onclick="applySort('due')">Promotion Due</div>
  </div>

</div>

<script>

const deptFilter = document.getElementById("deptFilter");
const unitFilter = document.getElementById("unitFilter");
const gradeFilter = document.getElementById("gradeFilter");
const bloodFilter = document.getElementById("bloodFilter");
const expFilter = document.getElementById("expFilter");
const promotionFilter = document.getElementById("promotionFilter");
const eligibilityFilter = document.getElementById("eligibilityFilter");
const droppedFilter = document.getElementById("droppedFilter");

const designationMap = {
E8:"Chief General Manager",E7:"General Manager",E6:"Deputy General Manager",E5:"Chief Manager",
E4:"Senior Manager",E3:"Manager",E2:"Deputy Manager",
E1:"Senior Engineer",E0:"Junior Engineer"
};

let data=[];
let currentSort = "";

const fileInput = document.getElementById("fileInput");

window.onload = () => {

  // Search functionality
  document.getElementById("search").addEventListener("input", function(){
    render();
  });

  // Load employee data saved in this browser
  const saved = localStorage.getItem("employeeData");

  if(saved){
    try {
      const savedData = JSON.parse(saved);

      if(Array.isArray(savedData) && savedData.length > 0){
        data = savedData;
        process();
        return;
      }

    } catch(error) {
      console.error("Saved employee data error:", error);
      localStorage.removeItem("employeeData");
    }
  }

  // No saved database: ask the user to upload the Excel file
  document.getElementById("list").innerHTML =
    "<p style='padding:20px;color:#64748b;'>Please upload Excel database to continue</p>";
};


// Excel upload: save the selected file's records in this browser
fileInput.onchange = e => {

  const file = e.target.files[0];
  if(!file) return;

  const reader = new FileReader();

  reader.onload = evt => {

    try {

      const wb = XLSX.read(evt.target.result, {
        type: "array"
      });

      const sheet = wb.Sheets[wb.SheetNames[0]];

      const newData = XLSX.utils.sheet_to_json(sheet, {
        raw: false,
        dateNF: "yyyy-mm-dd"
      });

      if(!newData.length){
        alert("Excel file contains no employee records.");
        fileInput.value = "";
        return;
      }

      // Save before replacing the currently displayed data
      localStorage.setItem("employeeData", JSON.stringify(newData));

      data = newData;
      process();

      alert("Employee database loaded and saved successfully.");

    } catch(error) {

      console.error("Excel loading / local storage error:", error);
      alert("Unable to load or save the Excel data. Please check the file and available browser storage");

    }

    fileInput.value = "";

  };

  reader.onerror = () => {
    alert("Unable to read the selected file");
    fileInput.value = "";
  };

  reader.readAsArrayBuffer(file);

};

function updateEvents(){
  let today = new Date();
  let m = today.getMonth();
  let d = today.getDate();

  let birthdays = data.filter(x=>{
    if(!x.DOB) return false;
    let dob = new Date(x.DOB);
    return dob.getDate() === d && dob.getMonth() === m;
  });

  let anniversaries = data.filter(x=>{
    if(!x.DOJ) return false;
    let doj = new Date(x.DOJ);
    return doj.getDate() === d && doj.getMonth() === m;
  });

  let html = "";

  if(birthdays.length){
    html += `<div>🎂 Birthdays: ${birthdays.map(x=>x.Name.split(" ")[0]).join(", ")}</div>`;
  }

  if(anniversaries.length){
    html += `<div>🎉 Anniversaries: ${anniversaries.map(x=>x.Name.split(" ")[0]).join(", ")}</div>`;
  }

  document.getElementById("eventsBar").innerHTML = html;
}

function process(){
  data.forEach(d=>{

    d.grade = String(d.Designation || "").match(/E\d+/)?.[0] || "";

    d.designationFull = designationMap[d.grade] || d.Designation || "Designation not provided";

    d.gradeLevel = parseInt(d.grade.replace("E","")) || 0;
    d.gradeDate = d[d.grade] || d.DOJ;

let yrs=(new Date()-new Date(d.gradeDate))/(1000*60*60*24*365);
d.years=yrs;
d.eligible=yrs>=4;
d.remaining=4-yrs;
d.droppedYears = d.remaining < 0 ? Math.abs(d.remaining) : 0;
d.expYears = (new Date() - new Date(d.DOJ)) / (1000*60*60*24*365);
d.gradeNum = parseInt((d.grade || "E0").replace("E","")) || 0;
d.age = (new Date() - new Date(d.DOB)) / (1000*60*60*24*365);
});

populateFilters();
updateEvents();
updateGradeSummary();
render();
}

function populateFilters(){
  fill(deptFilter,[...new Set(data.map(d=>d.Department))]);
  fill(unitFilter,[...new Set(data.map(d=>d.Unit))]);
  fill(gradeFilter,[...new Set(data.map(d=>d.grade))]);
  fill(bloodFilter,[...new Set(data.map(d=>d["Blood Group"]))]);

  expFilter.innerHTML = `
    <option value="">All</option>
    <option value="1-3">1–3 Years</option>
    <option value="3-5">3–5 Years</option>
    <option value="5-10">5–10 Years</option>
    <option value="10-15">10–15 Years</option>
    <option value="15-20">15–20 Years</option>
    <option value="20-25">20–25 Years</option>
    <option value="25+">Above 25 Years</option>
  `;
}

function fill(sel,arr){
  sel.innerHTML = "";  // clear previous values

  // default option
  let def = document.createElement("option");
  def.value = "";
  def.text = "All";
  sel.add(def);

  arr.forEach(v=>{
    if(!v) return;
    let o=document.createElement("option");
    o.value=v;
    o.text=v;
    sel.add(o);
  });
}

function render(){

let filtered = data.filter(d=>{
return (!deptFilter.value || (d.Department||"") === deptFilter.value) &&

(!unitFilter.value || d.Unit === unitFilter.value) &&

(!gradeFilter.value || d.grade === gradeFilter.value) &&

(!bloodFilter.value || d["Blood Group"] === bloodFilter.value) &&

(!expFilter.value || checkExperience(d.expYears, expFilter.value)) &&

(!promotionFilter.value ||
  (promotionFilter.value === "due" && d.remaining <=1 && d.remaining > 0) ||
  (promotionFilter.value === "overdue" && d.remaining <=0)
) &&

(!eligibilityFilter.value ||
  (eligibilityFilter.value === "yes" && d.eligible) ||
  (eligibilityFilter.value === "no" && !d.eligible)
) &&

(!droppedFilter.value ||
  (droppedFilter.value === "7+" && d.droppedYears > 7) ||
  (parseInt(droppedFilter.value) === Math.floor(d.droppedYears))
) &&

(
!search.value ||
(d.Name || "").toLowerCase().includes(search.value.toLowerCase()) ||
String(d["Emp No"]).includes(search.value) ||
(d.Department || "").toLowerCase().includes(search.value.toLowerCase()) ||
(d.grade || "").toLowerCase().includes(search.value.toLowerCase())
);

});

document.getElementById("employeeCount").innerText =
  `Showing ${filtered.length} of ${data.length}`;

if(currentSort === "name"){
  filtered.sort((a,b)=>(a.Name||"").localeCompare(b.Name||""));
}

if(currentSort === "age"){
  filtered.sort((a,b)=>(b.age||0)-(a.age||0));
}

if(currentSort === "exp"){
  filtered.sort((a,b)=>(b.expYears||0)-(a.expYears||0));
}

if(currentSort === "grade"){
  filtered.sort((a,b)=>(b.gradeNum||0)-(a.gradeNum||0));
}

if(currentSort === "due"){
  filtered.sort((a,b)=>(a.remaining||0)-(b.remaining||0));
}

if(currentSort === "seniority"){
  filtered.sort((a,b)=>{

    // 1. Compare grade (higher grade first)
    if((b.gradeNum||0)!==(a.gradeNum||0)){
      return (b.gradeNum||0)-(a.gradeNum||0);
    }

    // 2. Compare last promotion date (earlier = senior)
    let dateA = new Date(a["Last Promotion"] || a.gradeDate || 0);
    let dateB = new Date(b["Last Promotion"] || b.gradeDate || 0);

    if(dateA.getTime() !== dateB.getTime()){
      return dateA - dateB;
    }

    // 3. Final tie breaker → Employee number
    return (a["Emp No"]||0)-(b["Emp No"]||0);

  });
}

list.innerHTML="";

filtered.forEach((d,i)=>{

  let card = document.createElement("div");

  // ✅ CALCULATE HERE (outside HTML)
  let today = new Date();

  let isBirthday = false;
  let isAnniversary = false;

  if(d.DOB){
    let dob = new Date(d.DOB);
    isBirthday = dob.getDate() === today.getDate() && dob.getMonth() === today.getMonth();
  }

  if(d.DOJ){
    let doj = new Date(d.DOJ);
    isAnniversary = doj.getDate() === today.getDate() && doj.getMonth() === today.getMonth();
  }

  let highlightClass = "";

  if(d.remaining <= 1 && d.remaining > 0){
    highlightClass = "highlight-due";
  }
  else if(d.remaining <= 0){
    highlightClass = "highlight-overdue";
  }

  card.className = "card " + highlightClass;
  card.onclick = () => openModal(d,i+1);

  card.innerHTML = `
    <div class="serial">${i+1}</div>

    <div class="info">

      <div class="name-line">
        <span>
          ${d.Name}
          ${isBirthday ? '🎂' : ''}
          ${isAnniversary ? '🎉' : ''}
        </span>
        <span class="badge ${d.grade}">${d.grade}</span>
      </div>

      <div class="designation">
        ${d.designationFull}${d.Unit ? ' • ' + d.Unit : ''}
      </div>

      ${d.remaining <= 1 && d.remaining > 0 
        ? `<div style="font-size:11px;color:#a16207;font-weight:500;margin-top:4px;">
             Promotion due soon
           </div>` 
        : d.remaining <= 0
        ? `<div style="font-size:11px;color:#b91c1c;font-weight:500;margin-top:4px;">
             Promotion overdue
           </div>`
        : ""}

    </div>
  `;

  list.appendChild(card);
});
}

function updateGradeSummary(){
  let counts = {};

  data.forEach(d=>{
    let g = d.grade || "E0";
    counts[g] = (counts[g] || 0) + 1;
  });

  // Sort from E8 → E0
  let grades = ["E8","E7","E6","E5","E4","E3","E2","E1","E0"];

  let html = grades.map(g=>{
    let count = counts[g] || 0;
    return `<span class="grade-chip ${g}">${g}: ${count}</span>`;
  }).join("");

  document.getElementById("gradeSummary").innerHTML = html;
}

function formatDate(dateStr){
  if(!dateStr) return "";

  let d = new Date(dateStr);
  if(isNaN(d)) return dateStr;

  return d.toLocaleDateString("en-GB", {
    day: "numeric",
    month: "short",
    year: "numeric"
  });
}

function formatYearsMonths(years){
  if(!years || years < 0) return "";

  let y = Math.floor(years);
  let m = Math.floor((years - y) * 12);

  return `${y} yr ${m} mo`.replace("0 yr ","").replace(" 0 mo","");
}

function toggleFilter(){
  let panel = document.getElementById("filterPanel");
  panel.style.display = (panel.style.display === "block") ? "none" : "block";

function clearFilters(){

  document.querySelectorAll("#filterPanel select").forEach(s => s.value = "");

  // 🔷 Reset search (IMPORTANT)
  document.getElementById("search").value = "";

  // 🔷 Re-render data
  render();

  // 🔷 Optional: close filter panel (recommended UX)
  toggleFilter();
}

function checkExperience(exp, range){
  if(!exp) return false;

  if(range==="1-3") return exp>=1 && exp<3;
  if(range==="3-5") return exp>=3 && exp<5;
  if(range==="5-10") return exp>=5 && exp<10;
  if(range==="10-15") return exp>=10 && exp<15;
  if(range==="15-20") return exp>=15 && exp<20;
  if(range==="20-25") return exp>=20 && exp<25;
  if(range==="25+") return exp>=25;

  return true;
}
